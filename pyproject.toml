[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-monitor"
version = "0.1.0"
description = "Detect changes in the .ch and .li domain namespace and alert on rule matches"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "dnspython>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "idna>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
domain-monitor = "domain_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["domain_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
